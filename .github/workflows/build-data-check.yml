name: tekoha-build-data-check

# A dry run of the build-data path, on a push to the build-data branch only. The dashboard builder runs twice from the
# tree the last published dashboard build started from: once on the restored export (ddvanlith/tekoha, branch
# build-data), once on Supabase as dashboard.yml runs it today, a few minutes apart on the same day, so the date windows
# match; the two outputs are compared file by file, the build's own clock (as_of) aside. The export path is also
# compared with the published dashboard, which another day's windows make differ. Nothing is published. Each build
# prints what it received from its database.
on:
  push:
    branches: [build-data]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 60
          path: published

      # The last dashboard build committed dashboard/data; the commit before it is the tree that build read its previous
      # figures from (the NEW tags compare against them).
      - name: The tree the last build started from
        run: |
          cd published
          last=$(git log -1 --format=%H -- dashboard/data)
          base=$(git rev-parse "$last^")
          echo "published data: $(git log -1 --format='%h %cI %s' "$last"); started from: $(git log -1 --format='%h %s' "$base")"
          git worktree add -q "$GITHUB_WORKSPACE/site" "$base"
          git worktree add -q "$GITHUB_WORKSPACE/site-db" "$base"

      - uses: actions/checkout@v5
        with:
          repository: ddvanlith/tekoha
          ref: egress-build-data
          ssh-key: ${{ secrets.TEKOHA_CODE_KEY }}
          persist-credentials: false
          path: code

      - uses: actions/checkout@v5
        with:
          repository: ddvanlith/tekoha
          ref: build-data
          ssh-key: ${{ secrets.TEKOHA_CODE_KEY }}
          persist-credentials: false
          path: build-data

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json

      - name: Install
        working-directory: code
        run: npm ci --no-audit --no-fund

      - name: Restore the build data
        working-directory: code
        run: |
          bash pipeline/build-data/postgis.sh
          PSQL="docker exec -i tekoha-pg psql -U postgres -d postgres -q" node pipeline/build-data/restore.mjs --dir "$GITHUB_WORKSPACE/build-data"

      - name: Build from the export
        working-directory: code
        env:
          DATABASE_URL: postgresql://tekoha_reader:tekoha@localhost:5432/postgres
          NODE_OPTIONS: --import=file://${{ github.workspace }}/code/pipeline/build-data/count-reads.mjs
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
        run: |
          mkdir -p data
          if [ -f ../site/health-status.txt ]; then cp ../site/health-status.txt data/health-status.txt; fi
          SITE_DIR="$GITHUB_WORKSPACE/site" node pipeline/build-dashboard.mjs 2>&1 | sed -E -u 's#postgres(ql)?://[^[:space:]]*#[connection string]#g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[email]/g'

      - name: Build from Supabase, as dashboard.yml does today
        working-directory: code
        env:
          DATABASE_URL: ${{ secrets.READONLY_DATABASE_URL }}
          NODE_OPTIONS: --import=file://${{ github.workspace }}/code/pipeline/build-data/count-reads.mjs
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
        run: |
          SITE_DIR="$GITHUB_WORKSPACE/site-db" node pipeline/build-dashboard.mjs 2>&1 | sed -E -u 's#postgres(ql)?://[^[:space:]]*#[connection string]#g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[email]/g'

      - name: Compare the export build with the Supabase build
        run: node code/pipeline/build-data/compare.mjs site site-db dashboard --ignore '"as_of":"[^"]*"'

      - name: Compare the export build with the published dashboard (another day)
        run: node code/pipeline/build-data/compare.mjs site published dashboard --ignore '"as_of":"[^"]*"'
