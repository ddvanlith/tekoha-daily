name: tekoha-dashboard

# The market dashboard (https://ddvanlith.github.io/tekoha-daily/dashboard/), built here because Actions
# minutes are free on a public repository. The code is the private ddvanlith/tekoha
# (pipeline/build-dashboard.mjs), checked out with a read-only deploy key (secret TEKOHA_CODE_KEY). The
# builder does not read Supabase: the private daily pull exports what it reads once a day (pipeline/build-data,
# the orphan branch build-data, read with the same key), and the job restores it into a local PostGIS and runs
# the builder on it as tekoha_reader, so its SQL and every figure are the same and the free plan's 5 GB a month
# of data out is not spent here. The whole arrangement is in docs/ci-minutes.md of that repo.
#
# The edition (index.html, archive/) is still published by the private daily pull, which on every run
# also writes last-run.txt and health-status.txt here. That push starts this build, so the dashboard
# follows each run as it did when the pipeline built it. The schedule is the fallback for a run whose
# build did not happen: it builds only when the pipeline has published since the last dashboard. A
# manual dispatch skips that check. Any build, a manual dispatch too, holds when the build data is older than
# the newest pipeline run (that run's export failed), and says so in its log; the published dashboard stays.
#
# This log is public. The builder prints counts, timings and file sizes; its output also passes a filter
# that masks anything shaped like a connection string, an email address or a phone number.
on:
  push:
    branches: [main]
    paths: [last-run.txt]
  schedule:
    - cron: "15 23 * * *"
  workflow_dispatch: {}

concurrency:
  group: dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    # An explicit bash runs with pipefail, so a builder that fails fails its step through the log filter.
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - name: New pipeline run since the last dashboard?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=last-run.txt&per_page=1" -q '.[0].commit.committer.date // ""')
          BUILT=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=dashboard/data/summary.json&per_page=1" -q '.[0].commit.committer.date // ""')
          echo "pipeline last published ${RUN:-never}; dashboard built ${BUILT:-never}"
          if [ -n "$RUN" ] && [[ "$RUN" > "$BUILT" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new since the last dashboard."
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.build == 'true'
        with:
          repository: ddvanlith/tekoha
          ref: build-data
          ssh-key: ${{ secrets.TEKOHA_CODE_KEY }}
          persist-credentials: false
          path: build-data

      # An export older than the newest pipeline run (its export step failed or did not run) would publish an older
      # day's figures as new, so every build holds on it, a manual dispatch too. Fresh: the export came from the run
      # that wrote the newest last-run.txt (the run id in that commit's message is the manifest's pipeline_run), or it
      # was made after that run published (a seed dispatched by hand in the private repo).
      - name: Is the build data from the newest pipeline run?
        id: fresh
        if: steps.gate.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=last-run.txt&per_page=1" -q '.[0] // {}')
          RUN_AT=$(jq -r '.commit.committer.date // ""' <<< "$LAST")
          RUN_ID=$(jq -r '.commit.message // ""' <<< "$LAST" | sed -n 's/.*pipeline run \([0-9]*-[0-9]*\).*/\1/p')
          EXPORT_AT=$(jq -r '.exported_at // ""' build-data/manifest.json)
          EXPORT_RUN=$(jq -r '.pipeline_run // ""' build-data/manifest.json)
          echo "pipeline last published ${RUN_AT:-never}${RUN_ID:+ (run $RUN_ID)}; build data exported ${EXPORT_AT:-never}${EXPORT_RUN:+ (run $EXPORT_RUN)}"
          if [ -z "$RUN_AT" ] || { [ -n "$RUN_ID" ] && [ "$RUN_ID" = "$EXPORT_RUN" ]; } \
            || { [ -n "$EXPORT_AT" ] && [ "$(date -u -d "$EXPORT_AT" +%s)" -ge "$(date -u -d "$RUN_AT" +%s)" ]; }; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Held: the build data is older than the newest pipeline run (its export step failed or did not run); the published dashboard stays. The next export releases the build: the next daily pull, or the build-data-seed workflow in the private repo."
          fi

      - uses: actions/checkout@v5
        if: steps.fresh.outputs.build == 'true'
        with:
          path: site

      - uses: actions/checkout@v5
        if: steps.fresh.outputs.build == 'true'
        with:
          repository: ddvanlith/tekoha
          ssh-key: ${{ secrets.TEKOHA_CODE_KEY }}
          persist-credentials: false
          path: code

      - uses: actions/setup-node@v5
        if: steps.fresh.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json

      - name: Install
        if: steps.fresh.outputs.build == 'true'
        working-directory: code
        run: npm ci --no-audit --no-fund

      - name: Restore the build data
        if: steps.fresh.outputs.build == 'true'
        working-directory: code
        run: |
          bash pipeline/build-data/postgis.sh
          PSQL="docker exec -i tekoha-pg psql -U postgres -d postgres -q" node pipeline/build-data/restore.mjs --dir "$GITHUB_WORKSPACE/build-data"

      # The page prints the pipeline's health from data/health-status.txt, which the private run leaves
      # in this repo; without it the page says "status unknown", as it did when the health check never ran.
      # The repository variable CF_ANALYTICS_TOKEN turns on Cloudflare Web Analytics on the page, off
      # until it exists (docs/leads-and-sponsor.md in the private repo).
      - name: Build the dashboard
        if: steps.fresh.outputs.build == 'true'
        working-directory: code
        env:
          DATABASE_URL: postgresql://tekoha_reader:tekoha@localhost:5432/postgres
          CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
        run: |
          mkdir -p data
          if [ -f ../site/health-status.txt ]; then cp ../site/health-status.txt data/health-status.txt; fi
          SITE_DIR="$GITHUB_WORKSPACE/site" node pipeline/build-dashboard.mjs 2>&1 | sed -E -u 's#postgres(ql)?://[^[:space:]]*#[connection string]#g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[email]/g; s/\+?[0-9]([ .()-]{0,2}[0-9]){8,}/[number]/g'

      - name: Publish
        if: steps.fresh.outputs.build == 'true'
        working-directory: site
        run: |
          git config user.name "tekoha-dashboard" && git config user.email "dashboard@tekoha.local"
          git add -A dashboard
          if git diff --cached --quiet; then echo "dashboard unchanged"; exit 0; fi
          git commit -q -m "Dashboard $(date -u +%F)"
          # The private pipeline pushes editions to this branch; a push that lost that race rebases and retries.
          for i in 1 2 3; do git push -q && exit 0; sleep 5; git pull -q --rebase; done
          exit 1
